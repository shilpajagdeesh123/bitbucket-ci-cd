name: Secret Security Scan

on:
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Password and API Key Scan
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------
      # 1. Checkout repository
      # ---------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------
      # 2. Scan pushed changes
      # ---------------------------------------
      - name: Scan for Passwords and API Keys
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "      SECURITY SECRET SCANNER"
          echo "======================================"

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "After : $AFTER"

          # Handle first push/new branch
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              FILES=$(git show --pretty="" --name-only "$AFTER" | sort -u)
          else
              FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          if [[ -z "$FILES" ]]; then
              echo "No files to scan."
              exit 0
          fi

          echo ""
          echo "Changed files:"
          echo "$FILES"
          echo ""

          FOUND=0

          while IFS= read -r file; do

              [[ -z "$file" ]] && continue
              [[ ! -f "$file" ]] && continue

              echo "Scanning: $file"

              # Skip binary/generated files
              case "$file" in
                  *.jar|*.war|*.zip|*.png|*.jpg|*.jpeg|*.gif|*.pdf)
                      continue
                      ;;
                  node_modules/*|target/*|build/*|dist/*)
                      continue
                      ;;
              esac

              # ---------------------------------------
              # PASSWORD DETECTION
              # ---------------------------------------

              if grep -Ein \
              '(password|passwd|pwd)[._-]*[A-Za-z0-9_-]*[[:space:]]*[:=][[:space:]]*["'\'']?[^[:space:]"'\'']{4,}' \
              "$file" >/dev/null 2>&1
              then

                  echo "::error file=$file::Possible plaintext password detected"
                  FOUND=1
              fi

              # ---------------------------------------
              # API KEY / SECRET DETECTION
              # ---------------------------------------

              if grep -Ein \
              '(api[._-]?key|apikey|client[._-]?secret|access[._-]?key|secret[._-]?key)[[:space:]]*[:=][[:space:]]*["'\'']?[A-Za-z0-9_./+=-]{8,}' \
              "$file" >/dev/null 2>&1
              then

                  echo "::error file=$file::Possible API key or secret detected"
                  FOUND=1
              fi

          done <<< "$FILES"

          echo ""

          if [[ "$FOUND" -ne 0 ]]; then

              echo "======================================"
              echo " SECURITY VALIDATION: FAILED"
              echo "======================================"
              echo ""
              echo "Plaintext password/API key detected."
              echo ""
              echo "Remove the secret before proceeding."
              echo "Use GitHub Secrets or an approved"
              echo "enterprise secret-management solution."

              exit 1
          fi

          echo "======================================"
          echo " SECURITY VALIDATION: PASSED"
          echo "======================================"
