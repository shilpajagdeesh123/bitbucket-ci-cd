image: alpine:3.20

pipelines:
  default:
    - step:
        name: Security Scanner
        clone:
          depth: full
        script:
          - apk add --no-cache git grep
          - chmod +x .security/security-scan.sh
          - ./.security/security-scan.sh

  pull-requests:
    '**':
      - step:
          name: Pull Request Security Scanner
          clone:
            depth: full
          script:
            - apk add --no-cache git grep
            - chmod +x .security/security-scan.sh
            - ./.security/security-scan.sh
